<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wizard Fireball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const P = 6; // pixel size
const W = 80, H = 56;
canvas.width  = W * P;
canvas.height = H * P;
canvas.style.width  = W * P * 1.5 + 'px';
canvas.style.height = H * P * 1.5 + 'px';

// ── palette ──────────────────────────────────────────────
const C = {
  bg:       '#0d0d1a',
  bgGlow:   '#1a0a00',
  robe:     '#4a1880',
  robeDark: '#2d0f50',
  hat:      '#2d0f50',
  hatBrim:  '#3d1470',
  skin:     '#f5c6a0',
  skinShd:  '#d4a276',
  beard:    '#e8e8d0',
  beardShd: '#c8c8b0',
  staff:    '#8B6914',
  staffDk:  '#5a4010',
  gem:      '#00ffcc',
  gemGlow:  '#80ffee',
  star:     '#ffffaa',
  // fireball
  fb1:     '#ffffff',
  fb2:     '#ffffaa',
  fb3:     '#ffdd00',
  fb4:     '#ff9900',
  fb5:     '#ff4400',
  fb6:     '#cc1100',
  // smoke / trail
  sm1:     '#ff6600',
  sm2:     '#cc3300',
  sm3:     '#661100',
  sm4:     '#330800',
  // sparks
  sp1:     '#ffffff',
  sp2:     '#ffdd00',
  sp3:     '#ff6600',
};

function px(x, y, c, alpha) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (alpha !== undefined) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = c;
    ctx.fillRect(x * P, y * P, P, P);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = c;
    ctx.fillRect(x * P, y * P, P, P);
  }
}

// ── wizard sprite ─────────────────────────────────────────

function drawWizard(frame) {
  const castPhase = Math.floor(frame / 6) % 4; // 0=rest,1=wind,2=cast,3=rest

  // --- hat tip ---
  px(8, 1, C.hat);
  px(7, 2, C.hat); px(8, 2, C.hat);
  px(6, 3, C.hat); px(7, 3, C.hat); px(8, 3, C.hat);
  px(6, 4, C.hat); px(7, 4, C.hat); px(8, 4, C.hat); px(9, 4, C.hat);
  px(5, 5, C.hat); px(6, 5, C.hat); px(7, 5, C.hat); px(8, 5, C.hat); px(9, 5, C.hat);
  // hat brim
  for (let x = 3; x <= 12; x++) px(x, 6, C.hatBrim);
  px(3, 6, C.robeDark); px(12, 6, C.robeDark);
  // star on hat
  px(7, 3, C.star); px(7, 4, C.star);

  // --- face ---
  for (let y = 7; y <= 11; y++)
    for (let x = 5; x <= 10; x++) px(x, y, C.skin);
  px(4, 8, C.skin); px(4, 9, C.skin);
  px(11, 8, C.skin); px(11, 9, C.skin);
  // eyes
  px(6, 9, C.robeDark); px(9, 9, C.robeDark);
  // eyebrows (angled when casting)
  if (castPhase >= 1) {
    px(6, 8, C.beard); px(7, 8, C.beard);
    px(9, 8, C.robeDark); px(10, 8, C.beard);
  } else {
    px(5, 8, C.beard); px(6, 8, C.beard);
    px(9, 8, C.beard); px(10, 8, C.beard);
  }
  // nose
  px(7, 10, C.skinShd); px(8, 10, C.skinShd);

  // --- beard ---
  for (let x = 5; x <= 10; x++) px(x, 11, C.beard);
  for (let x = 4; x <= 11; x++) px(x, 12, C.beard);
  for (let x = 4; x <= 11; x++) px(x, 13, C.beard);
  for (let x = 5; x <= 10; x++) px(x, 14, C.beard);
  px(5, 14, C.beardShd); px(6, 14, C.beardShd); px(9, 14, C.beardShd); px(10, 14, C.beardShd);

  // --- robe body ---
  for (let y = 15; y <= 38; y++) {
    const spread = Math.min(Math.floor((y - 15) * 0.5), 8);
    for (let x = 7 - spread; x <= 8 + spread; x++) {
      const edge = x === 7 - spread || x === 8 + spread;
      px(x, y, edge ? C.robeDark : C.robe);
    }
  }
  // robe center shadow
  for (let y = 15; y <= 38; y++) px(7, y, C.robeDark);

  // --- left arm (holding staff, raised when casting) ---
  const staffY = castPhase === 2 ? -3 : castPhase === 1 ? -1 : 0;
  // upper arm
  for (let y = 16; y <= 22; y++) px(2, y + staffY, C.robe);
  // lower arm / hand
  for (let y = 22; y <= 26; y++) px(2, y + staffY, C.skin);
  px(3, 26 + staffY, C.skin);

  // --- staff ---
  for (let y = 2 + staffY; y <= 26 + staffY; y++) {
    px(1, y, C.staff);
    if (y % 4 === 0) px(1, y, C.staffDk);
  }
  // gem at top
  px(1, 1 + staffY, C.gemGlow);
  px(0, 1 + staffY, C.gem);
  px(1, 0 + staffY, C.gem);
  px(2, 1 + staffY, C.gem);
  // gem glow pulse
  const pulse = 0.3 + 0.3 * Math.sin(frame * 0.15);
  if (staffY <= -1) {
    px(0, 0 + staffY, C.gemGlow, pulse);
    px(2, 0 + staffY, C.gemGlow, pulse);
    px(1, -1 + staffY, C.gemGlow, pulse);
  }

  // --- right arm (casting) ---
  const castArmX = castPhase === 2 ? 16 : castPhase === 1 ? 15 : 14;
  const castArmY = castPhase === 2 ? 14 : castPhase === 1 ? 16 : 18;
  // upper arm
  for (let i = 0; i < 5; i++) px(castArmX - i, castArmY + i, C.robe);
  // hand
  px(castArmX - 5, castArmY + 5, C.skin);
  px(castArmX - 6, castArmY + 5, C.skin);
  px(castArmX - 5, castArmY + 6, C.skin);
}

// ── fireball system ───────────────────────────────────────

let fireballs = [];
let sparks    = [];
let nextShot  = 60;

class Fireball {
  constructor() {
    this.x    = 14;
    this.y    = 19;
    this.vx   = 1.2;
    this.vy   = -0.1;
    this.life = 0;
    this.dead = false;
  }
  update() {
    this.x   += this.vx;
    this.vy  += 0.04;
    this.y   += this.vy;
    this.life++;

    // trailing sparks
    for (let i = 0; i < 3; i++) {
      sparks.push({
        x:  this.x - 1 + Math.random() * 2,
        y:  this.y - 1 + Math.random() * 2,
        vx: -0.3 - Math.random() * 0.6,
        vy: (Math.random() - 0.5) * 0.4,
        life: 0,
        maxLife: 8 + Math.floor(Math.random() * 6),
        color: [C.sp1, C.sp2, C.sp3][Math.floor(Math.random() * 3)],
      });
    }
    if (this.x > W + 4 || this.y > H + 4) this.dead = true;
  }
  draw() {
    const ix = Math.round(this.x), iy = Math.round(this.y);
    const p  = (Math.sin(this.life * 0.4) + 1) / 2; // flicker

    // outer glow
    const gAlpha = 0.2 + p * 0.15;
    px(ix-3, iy,   C.fb5, gAlpha); px(ix+3, iy,   C.fb5, gAlpha);
    px(ix,   iy-3, C.fb5, gAlpha); px(ix,   iy+3, C.fb5, gAlpha);
    px(ix-2, iy-2, C.fb5, gAlpha); px(ix+2, iy-2, C.fb5, gAlpha);
    px(ix-2, iy+2, C.fb5, gAlpha); px(ix+2, iy+2, C.fb5, gAlpha);

    // mid flame
    px(ix-2, iy,   C.fb6); px(ix+2, iy,   C.fb6);
    px(ix,   iy-2, C.fb5); px(ix,   iy+2, C.fb6);
    px(ix-1, iy-2, C.fb5); px(ix+1, iy-2, C.fb5);
    px(ix-1, iy+2, C.fb6); px(ix+1, iy+2, C.fb6);
    px(ix-2, iy-1, C.fb5); px(ix+2, iy-1, C.fb5);
    px(ix-2, iy+1, C.fb6); px(ix+2, iy+1, C.fb6);

    // inner core
    px(ix-1, iy-1, C.fb3); px(ix,   iy-1, C.fb3); px(ix+1, iy-1, C.fb3);
    px(ix-1, iy,   C.fb4); px(ix,   iy,   C.fb2); px(ix+1, iy,   C.fb4);
    px(ix-1, iy+1, C.fb4); px(ix,   iy+1, C.fb4); px(ix+1, iy+1, C.fb5);

    // hot center
    px(ix, iy, C.fb1);
  }
}

function drawFloor() {
  for (let x = 0; x < W; x++) {
    px(x, 40, '#1a1a2e');
    px(x, 41, '#111122');
  }
  // shadow under wizard
  for (let x = 3; x <= 18; x++) px(x, 40, '#13103a', 0.6);
}

function drawBackground() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // subtle stars
  const stars = [[5,3],[15,8],[30,2],[45,5],[60,1],[70,7],[20,4],[55,3],[75,6]];
  stars.forEach(([x,y]) => px(x, y, C.star, 0.5 + 0.3 * Math.sin(frame * 0.05 + x)));
}

function drawImpact(x, y) {
  // explosion rings
  const ring = [C.fb3, C.fb4, C.fb5, C.fb6];
  ring.forEach((c, i) => {
    const r = i + 1;
    for (let dx = -r; dx <= r; dx++) {
      px(x + dx, y - r, c, 0.8);
      px(x + dx, y + r, c, 0.8);
    }
    for (let dy = -r; dy <= r; dy++) {
      px(x - r, y + dy, c, 0.8);
      px(x + r, y + dy, c, 0.8);
    }
  });
}

let frame = 0;

function update() {
  // spawn fireballs
  nextShot--;
  if (nextShot <= 0) {
    fireballs.push(new Fireball());
    nextShot = 55 + Math.floor(Math.random() * 20);
  }

  fireballs.forEach(f => f.update());
  fireballs = fireballs.filter(f => !f.dead);

  sparks.forEach(s => {
    s.x    += s.vx;
    s.y    += s.vy;
    s.vy   += 0.06;
    s.life++;
  });
  sparks = sparks.filter(s => s.life < s.maxLife);
}

function render() {
  drawBackground();
  drawFloor();
  drawWizard(frame);

  // draw sparks
  sparks.forEach(s => {
    const alpha = 1 - s.life / s.maxLife;
    px(Math.round(s.x), Math.round(s.y), s.color, alpha);
  });

  // draw fireballs
  fireballs.forEach(f => f.draw());

  frame++;
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
